<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django App{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0b0f1a;
            --card: #141a2b;
            --accent: #6c5ce7;
            --accent-2: #00cec9;
            --text: #eef1f8;
            --muted: #9aa3b5;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 6vw;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .logo span { color: var(--accent-2); }

        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        nav a:hover { color: var(--text); }

        main {
            flex: 1;
            padding: 3rem 6vw 5rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        main h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 0.6rem;
        }
        main h1 em {
            font-style: normal;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main .lead {
            color: var(--muted);
            max-width: 620px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .item-card {
            background: var(--card);
            border: 1px solid #222b45;
            border-radius: 16px;
            padding: 1.8rem;
            transition: border-color 0.2s, transform 0.2s;
        }
        .item-card:hover { border-color: var(--accent); transform: translateY(-4px); }

        .item-card h3 {
            margin-bottom: 0.5rem;
            color: var(--accent-2);
        }
        .item-card p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }
        .item-card time {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .empty {
            text-align: center;
            padding: 4rem 2rem;
            border: 1px dashed #2a3350;
            border-radius: 16px;
            color: var(--muted);
        }
        .empty a {
            color: var(--accent-2);
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-size: 0.85rem;
            border-top: 1px solid #1a2138;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">django<span>App</span></div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>© {% now "Y" %} Django App — Desarrollo de una aplicación Web con Django</footer>
</body>
</html>
